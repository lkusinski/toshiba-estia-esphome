binary_sensor:
  - platform: template
    name: "Estia: odszranianie (defrost)"
    id: estia_defrost
    device_class: heat
    icon: mdi:snowflake-melt
    lambda: |-
      if (id(estia_hz).state > 15.0f && (id(estia_two).state - id(estia_twi).state) < -0.3f) {
        return true;
      }
      return false;

  # Wczesne ostrzeżenia hydrauliczne i chłodnicze (Early Warning System)
  - platform: template
    name: "Estia: alarm wysokiego ciśnienia (PD)"
    id: estia_alarm_pd
    disabled_by_default: true
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(estia_pd).state > 3500.0f;

  - platform: template
    name: "Estia: alarm temp. tłoczenia (TD)"
    id: estia_alarm_td
    disabled_by_default: true
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return (id(estia_hz).state > 5.0f && id(estia_td).state > 90.0f);

  - platform: template
    name: "Estia: alarm temp. inwertera (THS)"
    id: estia_alarm_ths
    disabled_by_default: true
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(estia_ths).state > 80.0f;

  # Stany operacyjne urządzeń wykonawczych (domyślnie ukryte)
  - platform: template
    name: "Estia: praca sprężarki"
    id: estia_compressor_active
    disabled_by_default: true
    device_class: running
    entity_category: diagnostic
    icon: mdi:engine
    lambda: |-
      return id(estia_hz).state > 5.0f;

  - platform: template
    name: "Estia: praca pompy obiegowej"
    id: estia_pump_active
    disabled_by_default: true
    device_class: running
    entity_category: diagnostic
    icon: mdi:pump
    lambda: |-
      return (id(estia_hz).state > 0.0f || fabsf(id(estia_two).state - id(estia_twi).state) > 0.3f);


# --- Wartości pochodne liczone bezpośrednio na ESP ---
sensor:
  # Wskaźniki chłodnicze obiegu R410A (Inżynieria pomp ciepła)
  - platform: template
    name: "Estia: przegrzanie par (Superheat)"
    id: estia_superheat
    unit_of_measurement: "K"
    accuracy_decimals: 1
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:thermometer-chevron-up
    update_interval: 60s
    lambda: |-
      if (id(estia_hz).state < 10.0f) return NAN;
      return id(estia_ts).state - id(estia_te).state;

  - platform: template
    name: "Estia: dochłodzenie cieczy (Subcooling)"
    id: estia_subcooling
    unit_of_measurement: "K"
    accuracy_decimals: 1
    disabled_by_default: true
    entity_category: diagnostic
    icon: mdi:thermometer-chevron-down
    update_interval: 60s
    lambda: |-
      if (id(estia_hz).state < 10.0f) return NAN;
      return id(estia_tc).state - id(estia_tl).state;
  - platform: template
    name: "Estia: delta T"
    id: estia_dt
    unit_of_measurement: "K"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      return id(estia_two).state - id(estia_twi).state;

  - platform: template
    name: "Estia: moc elektryczna (szac.)"
    id: estia_p_el
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 15s
    lambda: |-
      return id(estia_current).state * 230.0f * ${power_cos_phi};

  - platform: template
    name: "Estia: moc grzewcza (szac.)"
    id: estia_p_th
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 15s
    lambda: |-
      float dt = id(estia_two).state - id(estia_twi).state;
      if (dt < 0.0f) dt = 0.0f;
      if (dt > 15.0f) dt = 15.0f;
      return dt * ${pump_flow_lh} * 4.186f / 3.6f;

  - platform: template
    name: "Estia: COP (szac.)"
    id: estia_cop
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 15s
    lambda: |-
      float pel = id(estia_p_el).state;
      float pth = id(estia_p_th).state;
      if (id(estia_hz).state < 10.0f || pel < 200.0f || pth <= 0.0f) return NAN;
      return pth / pel;

  - platform: total_daily_energy
    name: "Estia: energia elektryczna dziś"
    id: estia_energy_el_daily
    power_id: estia_p_el
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: total_daily_energy
    name: "Estia: ciepło wyprodukowane dziś"
    id: estia_energy_th_daily
    power_id: estia_p_th
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "Estia: średni dobowy COP"
    id: estia_cop_daily
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      float eel = id(estia_energy_el_daily).state;
      float eth = id(estia_energy_th_daily).state;
      if (eel <= 0.1f || eth <= 0.0f) return NAN;
      return eth / eel;

