# ==============================================================================
# Toshiba Estia R410A — Inteligentny Optymalizator Ogrzewania i Akumulacji PV
# Lokalizacja: Wiśniowa (Dom A) — Układ grzejnikowy + 2x podłogówka łazienkowa
# Aktualizacja: 2026-10-10 (Natywna autonomia ESP8266 + Climate C++)
#
# Architektura:
# 1. Główny termostat C.O. realizowany jest natywnie przez mikrokontroler ESP:
#    entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
# 2. Hebel bezpieczeństwa sprzętowego:
#    input_boolean.estia_master_sterowanie_dozwolone steruje
#    switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt (odcięcie TX na magistrali)
# 3. Dynamiczna krzywa grzewcza dostosowana do instalacji grzejnikowej
# 4. Summer Switch-Off — automatyczne wyłączanie ogrzewania w ciepłe dni (> 17°C)
# 5. Monitorowanie temperatur wewnętrznych (Midea Salon + Biuro z korektą)
# 6. Akumulacja termiczna przy nadwyżkach PV Wiśniowa i w strefie G12w
# ==============================================================================

input_boolean:
  estia_master_sterowanie_dozwolone:
    name: "Estia: Główny wyłącznik sterowania (Main Arming Switch)"
    icon: mdi:shield-check

  estia_master_blokada_sterowania:
    name: "Estia: Master blokada sterowania (Tylko odczyt)"
    icon: mdi:shield-lock

  estia_optymalizator_aktywny:
    name: "Estia: optymalizator aktywny"
    initial: true
    icon: mdi:robot

  estia_auto_wylaczenie_lato:
    name: "Estia: automatyczne wyłączanie w ciepłe dni (Lato)"
    initial: true
    icon: mdi:weather-sunny-alert

  estia_manual_override:
    name: "Estia: Wykryto nastawę ręczną (Manual Override)"
    initial: false
    icon: mdi:account-alert

  estia_termostat_pokojowy_odciecie:
    name: "Estia: wyłączanie pompy przy przegrzaniu domu (Termostat)"
    initial: true
    icon: mdi:home-thermometer

  estia_dokoncz_cykl_sprezarki:
    name: "Estia: dokończ cykl sprężarki przed wyłączeniem C.O."
    initial: true
    icon: mdi:timer-sync-outline

input_datetime:
  estia_ostatnia_zmiana_automatyczna:
    name: "Estia: Znacznik ostatniej zmiany automatycznej"
    has_date: true
    has_time: true
    initial: "2026-10-10 11:08:00"
    icon: mdi:clock-check

  estia_licznik_fizyczny_data_bazy:
    name: "Estia: Data i czas zapisu bazy podlicznika"
    has_date: true
    has_time: true
    icon: mdi:calendar-clock

  estia_licznik_fizyczny_data_ostatniego_odczytu:
    name: "Estia: Data i czas ostatniego odczytu podlicznika"
    has_date: true
    has_time: true
    icon: mdi:clock-check

input_select:
  estia_zarzadzanie_trybem_cichym:
    name: "Estia: Zarządzanie trybem cichym agregatu"
    options:
      - "Inteligentny (Auto / Optymalizator)"
      - "Wymuszony Cichy (Kaganiec 30 Hz)"
      - "Wyłączony (Pełna moc agregatu)"
    initial: "Inteligentny (Auto / Optymalizator)"
    icon: mdi:volume-mute

  estia_tryb_sterowania:
    name: "Estia: wyznaczanie temperatury w Strefie 1"
    options:
      - "Krzywa pogodowa + PV (Zalecany)"
      - "Stała temperatura (Manual)"
    initial: "Krzywa pogodowa + PV (Zalecany)"
    icon: mdi:tune

input_number:
  estia_tryb_cichy_prog_deficytu_temp:
    name: "Estia: Próg deficytu dla zdjęcia trybu cichego (Moc)"
    min: 0.3
    max: 2.5
    step: 0.1
    initial: 1.0
    unit_of_measurement: "K"
    icon: mdi:thermometer-alert

  estia_oczekiwana_temperatura_w_domu:
    name: "Dom: Oczekiwana temperatura (Wzorzec)"
    min: 18.0
    max: 24.0
    step: 0.1
    initial: 21.0
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer-outline

  estia_wplyw_temperatury_wewnetrznej:
    name: "Estia: wpływ temperatury w domu (Kompensacja)"
    min: 0.0
    max: 4.0
    step: 0.5
    initial: 2.0
    unit_of_measurement: "K/K"
    icon: mdi:scale-balance

  estia_histereza_wylaczenia_pokojowa:
    name: "Estia: histereza wyłączenia przy przegrzaniu (+K)"
    min: 0.1
    max: 1.0
    step: 0.05
    initial: 0.2
    unit_of_measurement: "K"
    icon: mdi:thermometer-chevron-up

  estia_histereza_zalaczenia_pokojowa:
    name: "Estia: histereza załączenia przy niedogrzaniu (-K)"
    min: 0.0
    max: 1.0
    step: 0.05
    initial: 0.1
    unit_of_measurement: "K"
    icon: mdi:thermometer-chevron-down

  estia_krzywa_offset:
    name: "Estia: korekta krzywej (offset)"
    min: -5.0
    max: 5.0
    step: 0.5
    initial: 0.0
    unit_of_measurement: "°C"
    icon: mdi:thermometer-plus

  estia_prog_wylaczenia_lato:
    name: "Estia: próg wyłączenia C.O. (ciepłe dni)"
    min: 14.0
    max: 22.0
    step: 0.5
    initial: 17.0
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up

  estia_pv_boost:
    name: "Estia: podbicie zadanej przy PV"
    min: 0.0
    max: 4.0
    step: 0.5
    initial: 2.0
    unit_of_measurement: "°C"
    icon: mdi:solar-power-variant

  estia_pv_prog_w:
    name: "Estia: próg mocy PV do boostu"
    min: 500
    max: 3500
    step: 100
    initial: 1200
    unit_of_measurement: "W"
    icon: mdi:flash-alert

  estia_g12w_boost:
    name: "Estia: podbicie w taniej strefie G12w"
    min: 0.0
    max: 3.0
    step: 0.5
    initial: 1.0
    unit_of_measurement: "°C"
    icon: mdi:clock-check-outline

  midea_salon_offset:
    name: "Midea Salon: korekta czujnika (offset)"
    min: -8.0
    max: 2.0
    step: 0.1
    initial: -5.4
    unit_of_measurement: "°C"
    icon: mdi:thermometer-minus

  midea_biuro_offset:
    name: "Midea Biuro: korekta czujnika (offset)"
    min: -8.0
    max: 2.0
    step: 0.1
    initial: -2.0
    unit_of_measurement: "°C"
    icon: mdi:thermometer-minus

  toshiba_cena_kwh:
    name: "Estia: cena energii (zł/kWh)"
    min: 0.1
    max: 3.0
    step: 0.01
    initial: 1.0
    unit_of_measurement: "zł/kWh"
    icon: mdi:cash

  estia_licznik_fizyczny_stan:
    name: "Estia: Fizyczny stan podlicznika prądu"
    min: 0.0
    max: 999999.0
    step: 0.01
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:counter

  estia_licznik_fizyczny_baza:
    name: "Estia: Fizyczny stan początkowy (baza)"
    min: 0.0
    max: 999999.0
    step: 0.01
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:flag-checkered

  estia_licznik_ha_baza:
    name: "Estia: Stan licznika HA w momencie zapisu bazy"
    min: 0.0
    max: 999999.0
    step: 0.001
    mode: box
    unit_of_measurement: "kWh"
    icon: mdi:home-assistant

input_button:
  estia_przywroc_sterowanie_automatyczne:
    name: "Estia: Przywróć sterowanie automatyczne"
    icon: mdi:autorenew

  estia_zapisz_baze_podlicznika:
    name: "Estia: Zapisz obecny odczyt jako bazę początkową"
    icon: mdi:content-save-cog

template:
  # --- Rejestrator ostatnich akcji (Historia 5 zdarzeń) ---
  - trigger:
      - trigger: state
        entity_id: sensor.toshiba_estia_r410a_estia_zadana_strefy_odczyt
      - trigger: event
        event_type: estia_akcja_sterowania
    sensor:
      - name: "Estia: ostatnie akcje ręczne"
        unique_id: estia_ostatnie_akcje_reczne
        icon: mdi:history
        state: >
          {% if trigger.platform == 'event' %}
            {{ trigger.event.data.akcja }}
          {% else %}
            {% set old_val = trigger.from_state.state if trigger.from_state is not none else '?' %}
            {% set new_val = trigger.to_state.state if trigger.to_state is not none else '?' %}
            {% set t_wyliczona = states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) %}
            {% if (new_val | float(-999)) == t_wyliczona %}
              {{ 'Autoadaptacja: ' ~ old_val ~ '°C -> ' ~ new_val ~ '°C' }}
            {% else %}
              {{ 'Zmiana zadanej: ' ~ old_val ~ '°C -> ' ~ new_val ~ '°C' }}
            {% endif %}
          {% endif %}
        attributes:
          ostatnia_akcja_czas: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          historia: >
            {% set default_hist = [
              {'czas': '11.10 02:00:27', 'akcja': 'Autoadaptacja: korekta wody', 'szczegoly': '31.0°C -> 30.0°C', 'zrodlo': 'Optymalizator HA (Autoadaptacja)'},
              {'czas': '11.10 01:31:00', 'akcja': 'Przywrócono sterowanie automatyczne', 'szczegoly': 'Zadana z krzywej: 31°C', 'zrodlo': 'Przycisk (Pushbutton HA)'},
              {'czas': '10.10 20:36:40', 'akcja': 'Przywrócono sterowanie automatyczne', 'szczegoly': 'Zadana z krzywej: 30°C', 'zrodlo': 'Przycisk (Pushbutton HA)'},
              {'czas': '10.10 20:36:33', 'akcja': 'Przywrócono sterowanie automatyczne', 'szczegoly': 'Zadana z krzywej: 30°C', 'zrodlo': 'Przycisk (Pushbutton HA)'},
              {'czas': '10.10 16:30:11', 'akcja': 'Ręczna zmiana nastawy', 'szczegoly': '30.0°C -> 31.0°C', 'zrodlo': 'Pilot naścienny (0x60) / UI'}
            ] %}
            {% set raw_hist = this.attributes.historia | default(default_hist, true) %}
            {% set ns = namespace(items=[]) %}
            {% for item in raw_hist %}
              {% if item.czas == '11.10 02:00:27' and 'Ręczna' in item.akcja %}
                {% set ns.items = ns.items + [{
                  'czas': '11.10 02:00:27',
                  'akcja': 'Autoadaptacja: korekta wody',
                  'szczegoly': '31.0°C -> 30.0°C',
                  'zrodlo': 'Optymalizator HA (Autoadaptacja)'
                }] %}
              {% else %}
                {% set ns.items = ns.items + [item] %}
              {% endif %}
            {% endfor %}
            {% set current_history = ns.items %}
            {% if trigger.platform == 'event' %}
              {% set nowy_wpis = {
                'czas': now().strftime('%d.%m %H:%M:%S'),
                'akcja': trigger.event.data.akcja,
                'szczegoly': trigger.event.data.szczegoly,
                'zrodlo': trigger.event.data.zrodlo
              } %}
              {{ ([nowy_wpis] + current_history)[:5] }}
            {% else %}
              {% set auto_ts = as_timestamp(states('input_datetime.estia_ostatnia_zmiana_automatyczna') | default('1970-01-01 00:00:00')) %}
              {% set jest_auto = (as_timestamp(now()) - auto_ts) < 20 %}
              {% set old_val = trigger.from_state.state if trigger.from_state is not none else '?' %}
              {% set new_val = trigger.to_state.state if trigger.to_state is not none else '?' %}
              {% set t_wyliczona = states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) %}
              {% set jest_zgodna = (new_val | float(-999)) == t_wyliczona %}
              {% if old_val != new_val and old_val not in ['unavailable', 'unknown'] and new_val not in ['unavailable', 'unknown'] %}
                {% if jest_auto or jest_zgodna %}
                  {% set nowy_wpis = {
                    'czas': now().strftime('%d.%m %H:%M:%S'),
                    'akcja': 'Autoadaptacja: korekta wody',
                    'szczegoly': old_val ~ '°C -> ' ~ new_val ~ '°C',
                    'zrodlo': 'Optymalizator HA (Autoadaptacja)'
                  } %}
                  {{ ([nowy_wpis] + current_history)[:5] }}
                {% else %}
                  {% set nowy_wpis = {
                    'czas': now().strftime('%d.%m %H:%M:%S'),
                    'akcja': 'Ręczna zmiana nastawy',
                    'szczegoly': old_val ~ '°C -> ' ~ new_val ~ '°C',
                    'zrodlo': 'Pilot naścienny (0x60) / UI'
                  } %}
                  {{ ([nowy_wpis] + current_history)[:5] }}
                {% endif %}
              {% else %}
                {{ current_history }}
              {% endif %}
            {% endif %}

  - binary_sensor:
      - name: "Estia: sprężarka pracuje"
        unique_id: estia_sprezarka_pracuje_bin
        icon: mdi:heat-pump
        state: >
          {{ states('sensor.toshiba_estia_r410a_estia_sprezarka_hz') | float(0) > 0 }}

      - name: "Estia: warunki boost PV"
        unique_id: estia_warunki_boost_pv
        icon: mdi:solar-power
        state: >
          {% set pv = states('sensor.falownik_pv_wisniowa_moc_ac') | float(0) %}
          {% set prog = states('input_number.estia_pv_prog_w') | float(1200) %}
          {{ pv >= prog }}

      - name: "Estia: tani prąd aktywny"
        unique_id: estia_tani_prad_aktywny
        icon: mdi:cash-check
        state: >
          {{ is_state('binary_sensor.i4_tania_strefa_g12w', 'on') or is_state('binary_sensor.estia_warunki_boost_pv', 'on') }}

      - name: "Estia: warunki wyłączenia lato"
        unique_id: estia_warunki_wylaczenia_lato
        icon: mdi:sun-snowflake-variant
        state: >
          {% set auto_lato = is_state('input_boolean.estia_auto_wylaczenie_lato', 'on') %}
          {% set t_zewn = states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') | float(10.0) %}
          {% set prog = states('input_number.estia_prog_wylaczenia_lato') | float(17.0) %}
          {{ auto_lato and (t_zewn >= prog) }}

      - name: "Estia: żądanie grzania termostatu pokojowego"
        unique_id: estia_zadanie_grzania_termostatu_pokojowego
        icon: mdi:home-thermometer
        state: >
          {% set aktywne = is_state('input_boolean.estia_termostat_pokojowy_odciecie', 'on') %}
          {% if not aktywne %}
            {{ true }}
          {% else %}
            {% set t_dom = states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.0) %}
            {% set t_cel = states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) %}
            {% set h_wyl = states('input_number.estia_histereza_wylaczenia_pokojowa') | float(0.2) %}
            {% set h_zal = states('input_number.estia_histereza_zalaczenia_pokojowa') | float(0.1) %}
            {% set is_heating = is_state('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1', 'heat') %}
            {% if is_heating %}
              {{ t_dom < (t_cel + h_wyl) }}
            {% else %}
              {{ t_dom <= (t_cel - h_zal) }}
            {% endif %}
          {% endif %}

      # --- Rekomendacja trybu cichego agregatu (Optymalizator) ---
      - name: "Estia: zalecany tryb cichy"
        unique_id: estia_zalecany_tryb_cichy
        icon: mdi:volume-mute
        state: >
          {% set tryb = states('input_select.estia_zarzadzanie_trybem_cichym') %}
          {% if tryb == 'Wymuszony Cichy (Kaganiec 30 Hz)' %}
            true
          {% elif tryb == 'Wyłączony (Pełna moc agregatu)' %}
            false
          {% else %}
            {% set is_defrost = is_state('binary_sensor.toshiba_estia_r410a_estia_odszranianie_defrost', 'on') %}
            {% set t_zewn = states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') | float(10.0) %}
            {% set t_dom = states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.0) %}
            {% set t_cel = states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) %}
            {% set prog = states('input_number.estia_tryb_cichy_prog_deficytu_temp') | float(1.0) %}
            {% set deficyt = t_cel - t_dom %}
            {% if is_defrost or t_zewn < -5.0 or deficyt >= prog %}
              false
            {% else %}
              true
            {% endif %}
          {% endif %}

  - sensor:
      # --- Temperatury wewnątrz domu (Midea z korektą) ---
      - name: "Dom: Salon temperatura (skorygowana)"
        unique_id: dom_salon_temp_skorygowana
        unit_of_measurement: "°C"
        icon: mdi:sofa
        state: >
          {% set raw = state_attr('climate.wisniowa_salon_klimatyzator_salon', 'current_temperature') | float(26.2) %}
          {% set off = states('input_number.midea_salon_offset') | float(-5.4) %}
          {{ (raw + off) | round(1) }}

      - name: "Dom: Biuro temperatura (skorygowana)"
        unique_id: dom_biuro_temp_skorygowana
        unit_of_measurement: "°C"
        icon: mdi:desk
        state: >
          {% set raw = states('sensor.146235046593451_indoor_temperature') | float(22.0) %}
          {% set off = states('input_number.midea_biuro_offset') | float(-2.0) %}
          {{ (raw + off) | round(1) }}

      - name: "Dom: Średnia temperatura wewnętrzna"
        unique_id: dom_srednia_temperatura_wewnetrzna
        unit_of_measurement: "°C"
        icon: mdi:home-thermometer
        state: >
          {% set raw_s = state_attr('climate.wisniowa_salon_klimatyzator_salon', 'current_temperature') | float(26.2) %}
          {% set off_s = states('input_number.midea_salon_offset') | float(-5.4) %}
          {% set raw_b = states('sensor.146235046593451_indoor_temperature') | float(22.0) %}
          {% set off_b = states('input_number.midea_biuro_offset') | float(-2.0) %}
          {% set t_s = raw_s + off_s %}
          {% set t_b = raw_b + off_b %}
          {{ ((t_s + t_b) / 2.0) | round(1) }}

      # --- Aliasy kompatybilności dla dashboardu ---
      - name: "Dom: Salon temp skorygowana"
        unique_id: dom_salon_temp_skorygowana_alias
        unit_of_measurement: "°C"
        icon: mdi:sofa
        state: "{{ states('sensor.dom_salon_temperatura_skorygowana') }}"

      - name: "Dom: Biuro temp skorygowana"
        unique_id: dom_biuro_temp_skorygowana_alias
        unit_of_measurement: "°C"
        icon: mdi:desk
        state: "{{ states('sensor.dom_biuro_temperatura_skorygowana') }}"

      # --- Krzywa grzewcza dla instalacji grzejnikowej ---
      - name: "Estia: krzywa pogodowa baza"
        unique_id: estia_krzywa_pogodowa_baza
        unit_of_measurement: "°C"
        icon: mdi:chart-bell-curve
        state: >
          {# Krzywa grzewcza dla grzejników: -15°C -> 42°C, +17°C -> 27°C #}
          {% set t_zewn = states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') | float(10.0) %}
          {% set t_min = -15.0 %}
          {% set t_max = 17.0 %}
          {% set sp_mroz = 42.0 %}
          {% set sp_cieplo = 28.5 %}
          {% if t_zewn <= t_min %}
            {{ sp_mroz }}
          {% elif t_zewn >= t_max %}
            {{ sp_cieplo }}
          {% else %}
            {% set nachylenie = (sp_mroz - sp_cieplo) / (t_max - t_min) %}
            {{ (sp_cieplo + (t_max - t_zewn) * nachylenie) | round(1) }}
          {% endif %}

      - name: "Estia: kompensacja pokojowa"
        unique_id: estia_kompensacja_pokojowa
        unit_of_measurement: "°C"
        icon: mdi:tune-vertical
        state: >
          {% set t_oczekiwana = states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) %}
          {% set t_srednia = states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.5) %}
          {% set kp = states('input_number.estia_wplyw_temperatury_wewnetrznej') | float(2.0) %}
          {% set uchyb = t_oczekiwana - t_srednia %}
          {% set raw_korekta = uchyb * kp %}
          {# Bezpieczny clamping: max -4.0 do +4.0 K na wodzie #}
          {{ [-4.0, [raw_korekta, 4.0] | min] | max | round(1) }}
        attributes:
          uchyb_temperatury_domu: >
            {{ (states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) - states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.5)) | round(2) }}
          wspolczynnik_kp: "{{ states('input_number.estia_wplyw_temperatury_wewnetrznej') | float(2.0) }}"
          oczekiwana_dom: "{{ states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) }}"
          srednia_dom: "{{ states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.5) }}"

      - name: "Estia: zadana wyliczona"
        unique_id: estia_zadana_wyliczona
        unit_of_measurement: "°C"
        icon: mdi:target
        state: >
          {% set tryb = states('input_select.estia_tryb_sterowania') %}
          {% if tryb == 'Stała temperatura (Manual)' %}
            {{ state_attr('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1', 'temperature') | float(32.0) }}
          {% else %}
            {% set baza = states('sensor.estia_krzywa_pogodowa_baza') | float(31.0) %}
            {% set offset = states('input_number.estia_krzywa_offset') | float(0.0) %}
            {% set kompensacja = states('sensor.estia_kompensacja_pokojowa') | float(0.0) %}
            {% set pv_aktywne = is_state('binary_sensor.estia_warunki_boost_pv', 'on') %}
            {% set g12_aktywne = is_state('binary_sensor.i4_tania_strefa_g12w', 'on') %}
            {% set boost_pv = states('input_number.estia_pv_boost') | float(2.0) if pv_aktywne else 0.0 %}
            {% set boost_g12 = states('input_number.estia_g12w_boost') | float(1.0) if (g12_aktywne and not pv_aktywne) else 0.0 %}
            
            {% set cel = baza + offset + kompensacja + boost_pv + boost_g12 %}
            {# Bezpieczny zakres dla instalacji grzejnikowej: min 25°C, max 50°C #}
            {{ [28.0, [((cel * 2) | round(0) / 2), 50.0] | min] | max | round(1) }}
          {% endif %}
        attributes:
          baza_pogodowa: "{{ states('sensor.estia_krzywa_pogodowa_baza') }}"
          kompensacja_pokojowa: "{{ states('sensor.estia_kompensacja_pokojowa') }}"
          offset_reczny: "{{ states('input_number.estia_krzywa_offset') }}"

      # --- Status operacyjny agregatu ---
      - name: "Estia: status pracy"
        unique_id: estia_status_pracy_opisowy
        icon: mdi:state-machine
        state: >
          {% set hz = states('sensor.toshiba_estia_r410a_estia_sprezarka_hz') | float(0) %}
          {% set climate_state = states('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1') %}
          {% set lato = is_state('binary_sensor.estia_warunki_wylaczenia_lato', 'on') %}
          {% set ro = is_state('switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt', 'on') %}
          {% set defrost = is_state('binary_sensor.toshiba_estia_r410a_estia_odszranianie_defrost', 'on') %}
          {% if ro %}
            Tylko odczyt (Blokada)
          {% elif climate_state == 'off' and lato %}
            Letni postój (Ciepły dzień)
          {% elif climate_state == 'off' %}
            Wyłączona (Czuwanie)
          {% elif defrost %}
            Odszranianie (Defrost)
          {% elif hz == 0 %}
            Postój (Histereza termostatu)
          {% elif hz <= 18 %}
            Grzanie modulowane (Cicha praca, min)
          {% elif hz <= 30 %}
            Grzanie standardowe
          {% else %}
            Grzanie intensywne (Wysoka moc)
          {% endif %}

      # --- Status i uzasadnienie decyzji trybu cichego ---
      - name: "Estia: status decyzji trybu cichego"
        unique_id: estia_tryb_cichy_status_decyzji
        icon: mdi:information-outline
        state: >
          {% set tryb = states('input_select.estia_zarzadzanie_trybem_cichym') %}
          {% if tryb == 'Wymuszony Cichy (Kaganiec 30 Hz)' %}
            Ręcznie wymuszony cichy (Kaganiec 30 Hz)
          {% elif tryb == 'Wyłączony (Pełna moc agregatu)' %}
            Ręcznie wyłączony (Pełna moc agregatu)
          {% else %}
            {% set is_defrost = is_state('binary_sensor.toshiba_estia_r410a_estia_odszranianie_defrost', 'on') %}
            {% set t_zewn = states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') | float(10.0) %}
            {% set t_dom = states('sensor.dom_srednia_temperatura_wewnetrzna') | float(21.0) %}
            {% set t_cel = states('input_number.estia_oczekiwana_temperatura_w_domu') | float(21.0) %}
            {% set prog = states('input_number.estia_tryb_cichy_prog_deficytu_temp') | float(1.0) %}
            {% set deficyt = (t_cel - t_dom) | round(2) %}
            {% if is_defrost %}
              Defrost w toku (Wymagana pełna moc)
            {% elif t_zewn < -5.0 %}
              Głęboki mróz poniżej -5°C (Pełna moc)
            {% elif deficyt >= prog %}
              Duży deficyt w domu {{ deficyt }}K (Szybkie nagrzewanie)
            {% else %}
              Optymalizacja COP / Antytaktowanie (Tryb cichy)
            {% endif %}
          {% endif %}
        attributes:
          tryb_zarzadzania: "{{ states('input_select.estia_zarzadzanie_trybem_cichym') }}"
          zalecany_stan: "{{ states('binary_sensor.estia_zalecany_tryb_cichy') }}"
          stan_biezacy_pompy: "{{ states('switch.toshiba_estia_r410a_estia_tryb_cichy_agregatu') }}"
          uchyb_temperatury: "{{ (states('input_number.estia_oczekiwana_temperatura_w_domu')|float(21.0) - states('sensor.dom_srednia_temperatura_wewnetrzna')|float(21.0)) | round(2) }} K"

      - name: "Estia: modulacja sprężarki"
        unique_id: estia_modulacja_sprezarki_procent
        unit_of_measurement: "%"
        icon: mdi:gauge
        state: >
          {# Agregat HWS-P805HR-E pracuje w zakresie do ~60 Hz #}
          {% set hz = states('sensor.toshiba_estia_r410a_estia_sprezarka_hz') | float(0) %}
          {% set max_hz = 60.0 %}
          {{ [100.0, ((hz / max_hz) * 100.0)] | min | round(0) }}

      - name: "Estia: ocena efektywności"
        unique_id: estia_ocena_efektywnosci
        icon: mdi:leaf
        state: >
          {% set cop = states('sensor.toshiba_estia_r410a_estia_cop_szac') | float(0) %}
          {% set hz = states('sensor.toshiba_estia_r410a_estia_sprezarka_hz') | float(0) %}
          {% if hz == 0 %}
            Brak pracy
          {% elif cop >= 3.8 %}
            Doskonała (A+++)
          {% elif cop >= 3.0 %}
            Wysoka (A++)
          {% elif cop >= 2.4 %}
            Umiarkowana
          {% else %}
            Niska
          {% endif %}

      - name: "Estia: koszt energii dziś (szac.)"
        unique_id: estia_koszt_dzien
        unit_of_measurement: "zł"
        icon: mdi:cash-clock
        state: >
          {# 1. Ceny z oficjalnej integracji Energa dla Wiśniowa 9 (taryfa G12W) #}
          {% set p_tania = states('sensor.energa_00069839_cena_poboru_strefa_2') | float(0.65) %}
          {% set p_droga = states('sensor.energa_00069839_cena_poboru_strefa_1') | float(1.30) %}

          {# 2. Zużycie energii pompy dziś (kWh) #}
          {% set e_tania = states('sensor.estia_energia_dzis_taryfy_tania') | float(0) %}
          {% set e_droga = states('sensor.estia_energia_dzis_taryfy_droga') | float(0) %}
          {% set kwh_total = states('sensor.toshiba_estia_r410a_estia_energia_elektryczna_dzis') | float(0) %}
          {% if kwh_total <= 0 %}
            {% set kwh_total = states('sensor.pompa_ciepla_toshiba_estia_energy_daily') | float(0) %}
          {% endif %}

          {# 3. Wyliczenie wartości taryfowej G12W (odniesienie) #}
          {% if (e_tania + e_droga) >= (kwh_total * 0.8) and (e_tania + e_droga) > 0 %}
            {% set wartosc_g12w = (e_tania * p_tania + e_droga * p_droga) %}
          {% else %}
            {% set cheap = is_state('binary_sensor.licznik_00069839_tania_strefa', 'on') %}
            {% set cena = p_tania if cheap else p_droga %}
            {% set wartosc_g12w = (kwh_total * cena) %}
          {% endif %}

          {# 4. Logika Net-Metering (GithubEnerga - stary system opustów 1:0.8 z magazynem wirtualnym) #}
          {% set bank_kwh = states('sensor.energa_00069839_bank_wirtualny_kwh') | float(0) %}
          {# Dopóki bank wirtualny pokrywa zapotrzebowanie, realny koszt energii wynosi 0.00 zł #}
          {% if bank_kwh > kwh_total %}
            {{ 0.00 }}
          {% else %}
            {{ (wartosc_g12w) | round(2) }}
          {% endif %}
        attributes:
          system_rozliczen: "Net-Metering (stary system opustów 1:0.8)"
          wspolczynnik_prosumencki: "{{ states('sensor.energa_00069839_wspolczynnik_prosumencki') | default('0.8') }}"
          magazyn_wirtualny_kwh: "{{ states('sensor.energa_00069839_bank_wirtualny_kwh') | default('0') }} kWh"
          pokrycie_z_magazynu: "{{ '100%' if states('sensor.energa_00069839_bank_wirtualny_kwh')|float(0) > states('sensor.toshiba_estia_r410a_estia_energia_elektryczna_dzis')|float(0) else 'Brak' }}"
          wartosc_taryfowa_g12w: >
            {% set p_tania = states('sensor.energa_00069839_cena_poboru_strefa_2') | float(0.65) %}
            {% set p_droga = states('sensor.energa_00069839_cena_poboru_strefa_1') | float(1.30) %}
            {% set e_tania = states('sensor.estia_energia_dzis_taryfy_tania') | float(0) %}
            {% set e_droga = states('sensor.estia_energia_dzis_taryfy_droga') | float(0) %}
            {% set kwh = states('sensor.toshiba_estia_r410a_estia_energia_elektryczna_dzis') | float(0) %}
            {% if (e_tania + e_droga) >= (kwh * 0.8) and (e_tania + e_droga) > 0 %}
              {{ (e_tania * p_tania + e_droga * p_droga) | round(2) }} zł
            {% else %}
              {% set cheap = is_state('binary_sensor.licznik_00069839_tania_strefa', 'on') %}
              {% set cena = p_tania if cheap else p_droga %}
              {{ (kwh * cena) | round(2) }} zł
            {% endif %}
          cena_strefa_1_droga: "{{ states('sensor.energa_00069839_cena_poboru_strefa_1') | default('1.30') }} zł/kWh"
          cena_strefa_2_tania: "{{ states('sensor.energa_00069839_cena_poboru_strefa_2') | default('0.65') }} zł/kWh"
          zrodlo_danych: "GithubEnerga / Integracja Energa My Meter (Licznik 00069839, Wiśniowa 9)"

      - name: "Estia: wartość energii dziś wg taryfy (bez PV)"
        unique_id: estia_wartosc_energii_dzis_taryfowa
        unit_of_measurement: "zł"
        icon: mdi:calculator
        state: >
          {% set p_tania = states('sensor.energa_00069839_cena_poboru_strefa_2') | float(0.65) %}
          {% set p_droga = states('sensor.energa_00069839_cena_poboru_strefa_1') | float(1.30) %}
          {% set e_tania = states('sensor.estia_energia_dzis_taryfy_tania') | float(0) %}
          {% set e_droga = states('sensor.estia_energia_dzis_taryfy_droga') | float(0) %}
          {% set kwh = states('sensor.toshiba_estia_r410a_estia_energia_elektryczna_dzis') | float(0) %}
          {% if kwh <= 0 %}
            {% set kwh = states('sensor.pompa_ciepla_toshiba_estia_energy_daily') | float(0) %}
          {% endif %}
          {% if (e_tania + e_droga) >= (kwh * 0.8) and (e_tania + e_droga) > 0 %}
            {{ (e_tania * p_tania + e_droga * p_droga) | round(2) }}
          {% else %}
            {% set cheap = is_state('binary_sensor.licznik_00069839_tania_strefa', 'on') %}
            {% set cena = p_tania if cheap else p_droga %}
            {{ (kwh * cena) | round(2) }}
          {% endif %}

      # ----------------------------------------------------------------------
      # AUDYT I WALIDACJA ZUŻYCIA ENERGII (FIZYCZNY PODLICZNIK VS HOME ASSISTANT)
      # ----------------------------------------------------------------------
      - name: "Estia: Podlicznik - zużycie rzeczywiste od bazy"
        unique_id: estia_podlicznik_zuzycie_rzeczywiste
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:meter-electric
        state: >
          {% set stan = states('input_number.estia_licznik_fizyczny_stan') | float(0) %}
          {% set baza = states('input_number.estia_licznik_fizyczny_baza') | float(0) %}
          {% if baza > 0 and stan >= baza %}
            {{ (stan - baza) | round(2) }}
          {% else %}
            0.0
          {% endif %}

      - name: "Estia: HA - zużycie energii pompy od bazy"
        unique_id: estia_ha_zuzycie_od_bazy
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:chart-bell-curve
        state: >
          {% set ha_teraz = states('sensor.pompa_ciepla_toshiba_estia_energy') | float(0) %}
          {% set ha_baza = states('input_number.estia_licznik_ha_baza') | float(0) %}
          {% if ha_baza > 0 and ha_teraz >= ha_baza %}
            {{ (ha_teraz - ha_baza) | round(2) }}
          {% else %}
            0.0
          {% endif %}

      - name: "Estia: Podlicznik - szacowany obecny stan z HA"
        unique_id: estia_podlicznik_szacowany_stan
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        icon: mdi:counter
        state: >
          {% set fiz_baza = states('input_number.estia_licznik_fizyczny_baza') | float(0) %}
          {% set ha_zuzycie = states('sensor.estia_ha_zuzycie_energii_pompy_od_bazy') | float(0) %}
          {% if fiz_baza > 0 %}
            {{ (fiz_baza + ha_zuzycie) | round(2) }}
          {% else %}
            {{ states('input_number.estia_licznik_fizyczny_stan') | float(0) | round(2) }}
          {% endif %}

      - name: "Estia: Podlicznik - różnica zużycia HA vs fizyczny"
        unique_id: estia_podlicznik_roznica_kwh
        unit_of_measurement: "kWh"
        icon: mdi:delta
        state: >
          {% set fiz_zuzycie = states('sensor.estia_podlicznik_zuzycie_rzeczywiste_od_bazy') | float(0) %}
          {% set ha_zuzycie = states('sensor.estia_ha_zuzycie_energii_pompy_od_bazy') | float(0) %}
          {% set baza = states('input_number.estia_licznik_fizyczny_baza') | float(0) %}
          {% if baza > 0 and fiz_zuzycie > 0 %}
            {{ (ha_zuzycie - fiz_zuzycie) | round(2) }}
          {% else %}
            0.0
          {% endif %}

      - name: "Estia: Podlicznik - błąd względny estymacji HA"
        unique_id: estia_podlicznik_blad_procent
        unit_of_measurement: "%"
        icon: mdi:percent
        state: >
          {% set fiz_zuzycie = states('sensor.estia_podlicznik_zuzycie_rzeczywiste_od_bazy') | float(0) %}
          {% set ha_zuzycie = states('sensor.estia_ha_zuzycie_energii_pompy_od_bazy') | float(0) %}
          {% if fiz_zuzycie > 0.5 %}
            {{ (((ha_zuzycie - fiz_zuzycie) / fiz_zuzycie) * 100.0) | round(1) }}
          {% else %}
            0.0
          {% endif %}

      - name: "Estia: Podlicznik - współczynnik korygujący (Fiz/HA)"
        unique_id: estia_podlicznik_wspolczynnik_korekcyjny
        icon: mdi:multiplication
        state: >
          {% set fiz_zuzycie = states('sensor.estia_podlicznik_zuzycie_rzeczywiste_od_bazy') | float(0) %}
          {% set ha_zuzycie = states('sensor.estia_ha_zuzycie_energii_pompy_od_bazy') | float(0) %}
          {% if ha_zuzycie > 0.5 and fiz_zuzycie > 0.5 %}
            {{ (fiz_zuzycie / ha_zuzycie) | round(3) }}
          {% else %}
            1.000
          {% endif %}

