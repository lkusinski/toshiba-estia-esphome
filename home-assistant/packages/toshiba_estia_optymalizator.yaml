automation:
  # ----------------------------------------------------------------------------
  # 1. Synchronizacja Master Switcha Tylko Odczyt (Hebel bezpieczeństwa)
  # ----------------------------------------------------------------------------
  - id: estia_master_blokada_sterowania_sync
    alias: "Estia: Synchronizacja Głównego Wyłącznika Sterowania (Main Switch)"
    description: >
      [BEZPIECZEŃSTWO SPRZĘTOWE - MAIN SAFETY ARMING SWITCH]
      Gdy input_boolean.estia_master_sterowanie_dozwolone jest OFF:
        - ESPHome tryb tylko odczyt jest WŁĄCZONY (odcięcie TX na poziomie procesora).
        - Wszelkie automatyzacje sterujące są bezwzględnie zablokowane.
      Gdy input_boolean.estia_master_sterowanie_dozwolone jest ON:
        - ESPHome tryb tylko odczyt jest WYŁĄCZONY (zezwolenie na nadawanie).
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.estia_master_sterowanie_dozwolone
      - platform: state
        entity_id: input_boolean.estia_master_blokada_sterowania
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/10"
    action:
      - choose:
          # Blokada włączona lub brak zezwolenia -> TYLKO ODCZYT (BEZPIECZNIK AKTYWNY)
          - conditions:
              - condition: or
                conditions:
                  - condition: state
                    entity_id: input_boolean.estia_master_sterowanie_dozwolone
                    state: "off"
                  - condition: state
                    entity_id: input_boolean.estia_master_blokada_sterowania
                    state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt
        default:
          # Pełne zezwolenie na sterowanie
          - action: switch.turn_off
            target:
              entity_id: switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt

  # ----------------------------------------------------------------------------
  # 2. Summer Switch-Off — automatyczne wyłączanie strefy C.O. w ciepłe dni
  # ----------------------------------------------------------------------------
  - id: estia_zarzadzanie_letnim_wylaczeniem
    alias: "Estia: Zarządzanie wyłączeniem w ciepłe dni (Lato)"
    description: >
      [OPTYMALIZACJA ENERGETYCZNA I OCHRONA PRZED TAKTOWANIEM]
      Wyłącza natywny termostat C.O., gdy temperatura na zewnątrz przekracza próg letni
      (domyślnie 17°C, konfigurowalny przez 'input_number.estia_prog_wylaczenia_lato').
      Ponowne załączenie następuje z bezpieczną histerezą 1.5 K (czyli przy <= 15.5°C).
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.estia_warunki_wylaczenia_lato
        for: "00:15:00"
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: state
        entity_id: input_boolean.estia_master_sterowanie_dozwolone
        state: "on"
      - condition: state
        entity_id: input_boolean.estia_master_blokada_sterowania
        state: "off"
      - condition: state
        entity_id: input_boolean.estia_auto_wylaczenie_lato
        state: "on"
    action:
      - choose:
          # Warunek: za ciepło na dworze -> wyłącz strefę 1 (hvac_mode: off)
          - conditions:
              - condition: state
                entity_id: binary_sensor.estia_warunki_wylaczenia_lato
                state: "on"
              - condition: template
                value_template: "{{ states('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1') != 'off' }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                data:
                  hvac_mode: "off"
              - action: logbook.log
                data:
                  name: "Estia Optymalizator"
                  message: >
                    Wyłączono ogrzewanie C.O. (tryb letni). Temp zewn: 
                    {{ states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') }}°C >= {{ states('input_number.estia_prog_wylaczenia_lato') }}°C.

          # Warunek: ochłodziło się (temp zewn < próg - 1.5 K) -> włącz strefę 1 (hvac_mode: heat)
          - conditions:
              - condition: template
                value_template: >
                  {% set t_zewn = states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') | float(10.0) %}
                  {% set prog = states('input_number.estia_prog_wylaczenia_lato') | float(17.0) %}
                  {{ t_zewn <= (prog - 1.5) }}
              - condition: state
                entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                state: "off"
              - condition: state
                entity_id: binary_sensor.estia_zadanie_grzania_termostatu_pokojowego
                state: "on"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                data:
                  hvac_mode: "heat"
              - action: logbook.log
                data:
                  name: "Estia Optymalizator"
                  message: >
                    Wznowiono ogrzewanie C.O. (koniec letniego postoju). Temp zewn: 
                    {{ states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') }}°C.

  # ----------------------------------------------------------------------------
  # 2b. Termostat pokojowy — wyłączenie i załączenie strefy C.O. (Room Cut-off)
  # ----------------------------------------------------------------------------
  - id: estia_termostat_pokojowy_zarzadzanie_strefa
    alias: "Estia: Termostat pokojowy — wyłączenie i załączenie strefy C.O."
    description: >
      [FUNKCJA TERMOSTATU POKOJOWEGO - ROOM CUT-OFF]
      Gdy średnia temperatura w domu przekroczy zadaną + histerezę wyłączenia (domyślnie +0.2 K),
      pompa ciepła jest całkowicie wyłączana (hvac_mode: off), co zapobiega przegrzewaniu domu
      i nocnemu taktowaniu sprężarki przy minimalnej mocy.
      Gdy temperatura w domu spadnie poniżej zadanej - histerezę załączenia (domyślnie -0.1 K),
      ogrzewanie zostaje wznowione (hvac_mode: heat) z optymalną nastawą wyliczoną z krzywej.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.estia_zadanie_grzania_termostatu_pokojowego
      - platform: state
        entity_id: binary_sensor.estia_sprezarka_pracuje
        to: "off"
      - platform: state
        entity_id: input_boolean.estia_termostat_pokojowy_odciecie
      - platform: state
        entity_id: input_boolean.estia_dokoncz_cykl_sprezarki
      - platform: state
        entity_id: input_number.estia_oczekiwana_temperatura_w_domu
      - platform: state
        entity_id: sensor.dom_srednia_temperatura_wewnetrzna
      - platform: time_pattern
        minutes: "/10"
    condition:
      - condition: state
        entity_id: input_boolean.estia_master_sterowanie_dozwolone
        state: "on"
      - condition: state
        entity_id: input_boolean.estia_master_blokada_sterowania
        state: "off"
      - condition: state
        entity_id: input_boolean.estia_optymalizator_aktywny
        state: "on"
      - condition: state
        entity_id: input_boolean.estia_manual_override
        state: "off"
      - condition: state
        entity_id: input_boolean.estia_termostat_pokojowy_odciecie
        state: "on"
      - condition: state
        entity_id: binary_sensor.toshiba_estia_r410a_estia_magistrala_ok
        state: "on"
    action:
      - choose:
          # Przypadek 1: Termostat mówi stop (przegrzanie) -> wyłącz strefę C.O.,
          # z poszanowaniem trwającego cyklu sprężarki (Finish Cycle Protection)
          - conditions:
              - condition: state
                entity_id: binary_sensor.estia_zadanie_grzania_termostatu_pokojowego
                state: "off"
              - condition: template
                value_template: "{{ states('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1') != 'off' }}"
              - condition: template
                value_template: >
                  {# Jeśli ochrona dokończenia cyklu jest włączona, czekamy aż sprężarka sama zgaśnie (sprezarka == off) #}
                  {% set dokoncz_cykl = is_state('input_boolean.estia_dokoncz_cykl_sprezarki', 'on') %}
                  {% set sprezarka_pracuje = is_state('binary_sensor.estia_sprezarka_pracuje', 'on') %}
                  {{ not (dokoncz_cykl and sprezarka_pracuje) }}
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                data:
                  hvac_mode: "off"
              - action: logbook.log
                data:
                  name: "Estia Termostat Pokojowy"
                  message: >
                    Wyłączono ogrzewanie C.O. (przegrzanie domu, cykl sprężarki zakończony). Temp średnia: 
                    {{ states('sensor.dom_srednia_temperatura_wewnetrzna') }}°C >= ({{ states('input_number.estia_oczekiwana_temperatura_w_domu') }}°C + {{ states('input_number.estia_histereza_wylaczenia_pokojowa') }}K).
              - event: estia_akcja_sterowania
                event_data:
                  akcja: "Termostat: wyłączenie C.O. (przegrzanie)"
                  szczegoly: "Średnia {{ states('sensor.dom_srednia_temperatura_wewnetrzna') }}°C (cykl zakończony)"
                  zrodlo: "Termostat pokojowy (Finish Cycle)"

          # Przypadek 2: Termostat mówi grzej (niedogrzanie) i nie ma trybu letniego -> włącz strefę C.O.
          - conditions:
              - condition: state
                entity_id: binary_sensor.estia_zadanie_grzania_termostatu_pokojowego
                state: "on"
              - condition: state
                entity_id: binary_sensor.estia_warunki_wylaczenia_lato
                state: "off"
              - condition: state
                entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                state: "off"
            sequence:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.estia_ostatnia_zmiana_automatyczna
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                data:
                  hvac_mode: "heat"
              - delay: 2
              - action: climate.set_temperature
                target:
                  entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
                data:
                  temperature: "{{ states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) }}"
              - action: logbook.log
                data:
                  name: "Estia Termostat Pokojowy"
                  message: >
                    Wznowiono ogrzewanie C.O. (żądanie dogrzania). Temp średnia: 
                    {{ states('sensor.dom_srednia_temperatura_wewnetrzna') }}°C <= ({{ states('input_number.estia_oczekiwana_temperatura_w_domu') }}°C - {{ states('input_number.estia_histereza_zalaczenia_pokojowa') }}K).
                    Zadana wody: {{ states('sensor.estia_zadana_wyliczona') | round(1) }}°C.
              - event: estia_akcja_sterowania
                event_data:
                  akcja: "Termostat: wznowienie C.O. (dogrzanie)"
                  szczegoly: "Średnia {{ states('sensor.dom_srednia_temperatura_wewnetrzna') }}°C, woda: {{ states('sensor.estia_zadana_wyliczona') | round(1) }}°C"
                  zrodlo: "Termostat pokojowy (Room Cut-off)"

  # ----------------------------------------------------------------------------
  # 3. Aplikowanie wyliczonej zadanej temperatury (Optymalizator pogodowy + PV + G12w)
  # ----------------------------------------------------------------------------
  - id: estia_aplikuj_zadana_temperature
    alias: "Estia: Aplikuj wyliczoną zadaną temperaturę"
    description: >
      [DYNAMIKA TEMPERATURY WODY I OCHRONA SPRZĘŻARKI PRZED ZBĘDNYMI ZMIANAMI]
      Oblicza optymalną temperaturę wody zasilającej i przesyła ją do natywnego termostatu klimatu
      (obsługiwanego bezpośrednio w C++ na procesorze ESP).
      Zabezpieczenia:
        1. Krok histerezy 1.0 K zapobiega niepotrzebnemu wysyłaniu komend przy minimalnych wahaniach.
        2. Działa tylko przy odblokowanym heblu master i w trybie HEAT.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/15"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: input_number.estia_oczekiwana_temperatura_w_domu
      - platform: state
        entity_id: input_number.estia_wplyw_temperatury_wewnetrznej
      - platform: state
        entity_id: sensor.dom_srednia_temperatura_wewnetrzna
      - platform: state
        entity_id: binary_sensor.estia_warunki_boost_pv
      - platform: state
        entity_id: binary_sensor.i4_tania_strefa_g12w
      - platform: state
        entity_id: input_number.estia_krzywa_offset
      - platform: state
        entity_id: input_select.estia_tryb_sterowania
    condition:
      - condition: state
        entity_id: input_boolean.estia_master_sterowanie_dozwolone
        state: "on"
      - condition: state
        entity_id: input_boolean.estia_master_blokada_sterowania
        state: "off"
      - condition: state
        entity_id: input_boolean.estia_optymalizator_aktywny
        state: "on"
      - condition: state
        entity_id: input_boolean.estia_manual_override
        state: "off"
      - condition: state
        entity_id: input_select.estia_tryb_sterowania
        state: "Krzywa pogodowa + PV (Zalecany)"
      - condition: state
        entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
        state: "heat"
      - condition: state
        entity_id: binary_sensor.toshiba_estia_r410a_estia_magistrala_ok
        state: "on"
    action:
      - variables:
          zadana_cel: "{{ states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) }}"
          obecna: "{{ state_attr('climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1', 'temperature') | float(31.0) }}"
      - if:
          - condition: template
            value_template: "{{ (zadana_cel - obecna) | abs >= 0.5 }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.estia_ostatnia_zmiana_automatyczna
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - action: climate.set_temperature
            target:
              entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
            data:
              temperature: "{{ zadana_cel }}"
          - action: logbook.log
            data:
              name: "Estia Optymalizator"
              message: >
                Zmieniono nastawę strefy 1 z {{ obecna }}°C na {{ zadana_cel }}°C
                (T_zewn: {{ states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') }}°C,
                 PV: {{ states('sensor.falownik_pv_wisniowa_moc_ac') }} W,
                 G12w: {{ states('binary_sensor.i4_tania_strefa_g12w') }})

  # ----------------------------------------------------------------------------
  # 4. Alarmy krytyczne (Ochrona układu chłodniczego i powiadomienie push)
  # ----------------------------------------------------------------------------
  - id: estia_alarm_powiadomienie_lukasz
    alias: "Estia: Alarmy krytyczne na telefon"
    description: >
      [BEZPIECZEŃSTWO AGREGATU I INSTALACJI CHŁODNICZEJ]
      Natychmiastowe ostrzeżenie push na iPhone Łukasz o stanach przedawaryjnych.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.toshiba_estia_r410a_estia_cisnienie_wysokie
        above: 3100
        for: "00:03:00"
      - platform: numeric_state
        entity_id: sensor.toshiba_estia_r410a_estia_temp_zrzutu
        above: 90
        for: "00:02:00"
      - platform: state
        entity_id: binary_sensor.toshiba_estia_r410a_estia_blad_zdalnego_sterownika
        to: "on"
        for: "00:05:00"
    condition:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ trigger.entity_id != 'sensor.toshiba_estia_r410a_estia_temp_zrzutu' }}"
          - condition: numeric_state
            entity_id: sensor.toshiba_estia_r410a_estia_sprezarka_hz
            above: 5
    action:
      - action: notify.send_message
        target:
          entity_id: notify.iphone_lukasz
        data:
          title: "⚠️ Alarm Pompy Ciepła Estia"
          message: >
            Wykryto anomalię: {{ trigger.entity_id }} = {{ trigger.to_state.state }}.
            Temp zewn: {{ states('sensor.toshiba_estia_r410a_estia_temp_zewnetrzna') }}°C,
            Sprężarka: {{ states('sensor.toshiba_estia_r410a_estia_sprezarka_hz') }} Hz.

  # ----------------------------------------------------------------------------
  # 5. Synchronizacja taryfy G12W Energa dla licznika energii pompy ciepła
  # ----------------------------------------------------------------------------
  - id: estia_synchronizacja_taryfy_energa_g12w
    alias: "Estia: Synchronizacja taryfy Energa G12W (Tania / Droga)"
    description: >
      Automatycznie przełącza strefę licznika utility_meter pompy ciepła między tanią (noc/weekend)
      a drogą (szczyt) na podstawie stanu binary_sensor.licznik_00069839_tania_strefa.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.licznik_00069839_tania_strefa
      - trigger: homeassistant
        event: start
    actions:
      - action: select.select_option
        target:
          entity_id: select.estia_energia_dzis_taryfy
        data:
          option: "{{ 'tania' if is_state('binary_sensor.licznik_00069839_tania_strefa', 'on') else 'droga' }}"

  # ----------------------------------------------------------------------------
  # 6. Detekcja ręcznej nastawy (Manual Override na pilocie lub w UI)
  # ----------------------------------------------------------------------------
  - id: estia_wykryj_akcje_reczna_override
    alias: "Estia: Detekcja ręcznej nastawy (Manual Override)"
    description: >
      Wykrywa zmianę temperatury zadanej pochodzącą spoza automatyzacji
      (np. wciśnięcie przycisku na fizycznym pilocie na ścianie).
      Aktywuje flagę Manual Override, zapobiegając nadpisaniu przez krzywą pogodową.
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.toshiba_estia_r410a_estia_zadana_strefy_odczyt
    condition:
      - condition: template
        value_template: >
          {% set auto_ts = as_timestamp(states('input_datetime.estia_ostatnia_zmiana_automatyczna') | default('1970-01-01 00:00:00')) %}
          {% set jest_auto = (as_timestamp(now()) - auto_ts) < 20 %}
          {% set old_v = trigger.from_state.state if trigger.from_state is not none else '?' %}
          {% set new_v = trigger.to_state.state if trigger.to_state is not none else '?' %}
          {% set t_wyliczona = states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) %}
          {% set jest_zgodna = (new_v | float(-999)) == t_wyliczona %}
          {{ old_v != new_v and old_v not in ['unavailable','unknown'] and new_v not in ['unavailable','unknown'] and not jest_auto and not jest_zgodna }}
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.estia_manual_override
      - action: logbook.log
        data:
          name: "Estia Manual Override"
          message: >
            Wykryto ręczną zmianę nastawy na pilocie naściennym z {{ trigger.from_state.state }}°C na {{ trigger.to_state.state }}°C.
            Automatyka wstrzymuje nadpisywanie do momentu wciśnięcia przycisku 'Przywróć sterowanie automatyczne'.

  # ----------------------------------------------------------------------------
  # 7. Przycisk przywracania sterowania automatycznego (Pushbutton Handler)
  # ----------------------------------------------------------------------------
  - id: estia_przycisk_przywroc_auto_sync
    alias: "Estia: Przycisk Przywróć sterowanie automatyczne"
    description: >
      Reaguje na naciśnięcie przycisku 'Przywróć sterowanie automatyczne'.
      Odblokowuje hebel master, kasuje tryb ręczny i natychmiast aplikuje krzywą pogodową.
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.estia_przywroc_sterowanie_automatyczne
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.estia_master_sterowanie_dozwolone
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.estia_master_blokada_sterowania
            - input_boolean.estia_manual_override
      - action: input_select.select_option
        target:
          entity_id: input_select.estia_tryb_sterowania
        data:
          option: "Krzywa pogodowa + PV (Zalecany)"
      - action: switch.turn_off
        target:
          entity_id: switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.estia_ostatnia_zmiana_automatyczna
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: climate.set_temperature
        target:
          entity_id: climate.toshiba_estia_r410a_estia_ogrzewanie_strefy_1
        data:
          temperature: "{{ states('sensor.estia_zadana_wyliczona') | float(31.5) | round(1) }}"
      - action: logbook.log
        data:
          name: "Estia Optymalizator"
          message: >
            Wciśnięto przycisk: Przywrócono sterowanie automatyczne. Zaaplikowano zadaną z krzywej: {{ states('sensor.estia_zadana_wyliczona') | round(1) }}°C.
      - event: estia_akcja_sterowania
        event_data:
          akcja: "Przywrócono sterowanie automatyczne"
          szczegoly: "Zadana z krzywej: {{ states('sensor.estia_zadana_wyliczona') | round(1) }}°C"
          zrodlo: "Przycisk (Pushbutton HA)"

  # ----------------------------------------------------------------------------
  # 8. Podlicznik prądu pompy ciepła — zapis bazy początkowej
  # ----------------------------------------------------------------------------
  - id: estia_zapisz_baze_podlicznika_pradu
    alias: "Estia: Zapis bazy podlicznika prądu"
    description: >
      Zapisuje aktualny fizyczny odczyt podlicznika (z input_number.estia_licznik_fizyczny_stan)
      oraz aktualny stan encji energii w Home Assistant (sensor.pompa_ciepla_toshiba_estia_energy)
      jako punkt odniesienia do długoterminowego audytu porównawczego.
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.estia_zapisz_baze_podlicznika
      - platform: state
        entity_id: input_number.estia_licznik_fizyczny_stan
    condition:
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == 'input_button.estia_zapisz_baze_podlicznika' }}"
          - condition: numeric_state
            entity_id: input_number.estia_licznik_fizyczny_baza
            below: 0.05
    action:
      - action: input_number.set_value
        target:
          entity_id: input_number.estia_licznik_fizyczny_baza
        data:
          value: "{{ states('input_number.estia_licznik_fizyczny_stan') | float(0) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.estia_licznik_ha_baza
        data:
          value: "{{ states('sensor.pompa_ciepla_toshiba_estia_energy') | float(0) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.estia_licznik_fizyczny_data_bazy
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.estia_licznik_fizyczny_data_ostatniego_odczytu
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: logbook.log
        data:
          name: "Estia Podlicznik"
          message: >
            Zapisano bazę podlicznika: Fizyczny = {{ states('input_number.estia_licznik_fizyczny_stan') }} kWh,
            HA = {{ states('sensor.pompa_ciepla_toshiba_estia_energy') }} kWh.

  # ----------------------------------------------------------------------------
  # 9. Podlicznik prądu pompy ciepła — aktualizacja daty odczytu
  # ----------------------------------------------------------------------------
  - id: estia_aktualizacja_daty_odczytu_podlicznika
    alias: "Estia: Aktualizacja daty odczytu podlicznika"
    description: >
      Aktualizuje znacznik czasu przy każdej ręcznej zmianie stanu fizycznego podlicznika.
    mode: single
    trigger:
      - platform: state
        entity_id: input_number.estia_licznik_fizyczny_stan
    condition:
      - condition: template
        value_template: "{{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != trigger.to_state.state }}"
      - condition: numeric_state
        entity_id: input_number.estia_licznik_fizyczny_baza
        above: 0.05
    action:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.estia_licznik_fizyczny_data_ostatniego_odczytu
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  # ----------------------------------------------------------------------------
  # 10. Nadzorca i automatyczna korekta trybu cichego agregatu
  # ----------------------------------------------------------------------------
  - id: estia_nadzorca_i_korekta_trybu_cichego
    alias: "Estia: Nadzorca i automatyczna korekta trybu cichego"
    description: >
      Nadzoruje stan trybu cichego agregatu, weryfikuje zgodność z zaleceniem
      optymalizatora i koryguje nastawę w razie rozbieżności.
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.estia_zalecany_tryb_cichy
        for: "00:00:15"
      - trigger: state
        entity_id: switch.toshiba_estia_r410a_estia_tryb_cichy_agregatu
        for: "00:00:20"
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: binary_sensor.toshiba_estia_r410a_estia_magistrala_ok
        state: "on"
      - condition: state
        entity_id: switch.toshiba_estia_r410a_estia_tryb_tylko_odczyt
        state: "off"
      - condition: template
        value_template: >
          {{ states('switch.toshiba_estia_r410a_estia_tryb_cichy_agregatu') != states('binary_sensor.estia_zalecany_tryb_cichy') }}
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.estia_zalecany_tryb_cichy
                state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.toshiba_estia_r410a_estia_tryb_cichy_agregatu
              - action: logbook.log
                data:
                  name: "Estia Nadzorca"
                  message: "Załączono tryb cichy agregatu (Powód: {{ states('sensor.estia_tryb_cichy_status_decyzji') }})"
          - conditions:
              - condition: state
                entity_id: binary_sensor.estia_zalecany_tryb_cichy
                state: "off"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.toshiba_estia_r410a_estia_tryb_cichy_agregatu
              - action: logbook.log
                data:
                  name: "Estia Nadzorca"
                  message: "Wyłączono tryb cichy agregatu (Powód: {{ states('sensor.estia_tryb_cichy_status_decyzji') }})"

utility_meter:
  estia_energia_dzis_taryfy:
    name: "Estia: energia dziś (taryfy G12W)"
    source: sensor.pompa_ciepla_toshiba_estia_energy
    cycle: daily
    tariffs:
      - tania
      - droga

